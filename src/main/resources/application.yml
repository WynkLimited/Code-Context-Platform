spring:
  application.name: code-context-platform
  profiles.active: ${APP_PROFILE:local}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/code_context}
    username: ${DATABASE_USER:code_context}
    password: ${DATABASE_PASSWORD:local_only_change_me}
  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholders:
      vectorDimensions: ${EMBEDDING_DIMENSIONS:1024}
  ai:
    mcp.server:
      name: code-context-platform
      version: 0.1.0
      protocol: STREAMABLE
      annotation-scanner.enabled: false
      streamable-http.mcp-endpoint: /mcp
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      embedding:
        model: ${EMBEDDING_MODEL:qwen3-embedding:0.6b}
        num-ctx: 8192
    vectorstore.pgvector:
      initialize-schema: false
      dimensions: ${EMBEDDING_DIMENSIONS:1024}
      index-type: HNSW
      distance-type: COSINE_DISTANCE
  threads.virtual.enabled: true
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
management:
  endpoints.web.exposure.include: health,info,metrics,prometheus
  endpoint.health.probes.enabled: true
code-context:
  repository-root: ${REPOSITORY_ROOT:/var/lib/code-context/repos}
  local-git-root: ${LOCAL_GIT_ROOT:/fixtures}
  zoekt-index-root: ${ZOEKT_INDEX_ROOT:/var/lib/code-context/zoekt}
  # Dual-key rotation: team=current|previous accepts either key during overlap; drop previous to revoke.
  api-keys: ${TEAM_API_KEYS:local-dev=local-dev-token}
  admin-api-keys: ${ADMIN_API_KEYS:local-dev=local-dev-token}
  # 0 disables limiting; positive budgets use PostgreSQL across replicas by default.
  rate-limit-per-minute: ${RATE_LIMIT_PER_MINUTE:0}
  rate-limit-store: ${RATE_LIMIT_STORE:postgres}
  webhook-secret: ${WEBHOOK_SECRET:local-webhook-secret-change-me}
  git-access-token: ${GIT_ACCESS_TOKEN:}
  git-allowed-hosts: ${GIT_ALLOWED_HOSTS:github.com}
  mcp-allowed-origins: ${MCP_ALLOWED_ORIGINS:http://localhost,http://127.0.0.1}
  embedding-dimensions: ${EMBEDDING_DIMENSIONS:1024}
  max-file-bytes: ${MAX_FILE_BYTES:1048576}
  max-chunk-chars: ${MAX_CHUNK_CHARS:6000}
  max-index-concurrency: ${MAX_INDEX_CONCURRENCY:2}
  git-timeout-seconds: ${GIT_TIMEOUT_SECONDS:300}
  zoekt:
    indexer: ${ZOEKT_INDEXER:zoekt-git-index}
    cleaner: ${ZOEKT_CLEANER:zoekt-local-sync}
    webserver: ${ZOEKT_WEB_SERVER:http://zoekt:6070}
  graphify:
    command: ${GRAPHIFY_COMMAND:graphify}
    enabled: ${GRAPHIFY_ENABLED:false}
---
spring:
  config.activate.on-profile: test
code-context:
  api-keys: test=test-token
---
spring:
  config.activate.on-profile: production
  ai.ollama.base-url: ${OLLAMA_BASE_URL}
code-context:
  api-keys: ${TEAM_API_KEYS}
  admin-api-keys: ${ADMIN_API_KEYS}
  webhook-secret: ${WEBHOOK_SECRET}
  git-access-token: ${GIT_ACCESS_TOKEN}
