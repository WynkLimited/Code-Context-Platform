apiVersion: v1
kind: Service
metadata: {name: ollama, namespace: code-context}
spec:
  selector: {app: ollama}
  ports: [{name: http, port: 11434, targetPort: 11434}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: ollama, namespace: code-context}
spec:
  serviceName: ollama
  replicas: 1
  selector: {matchLabels: {app: ollama}}
  template:
    metadata: {labels: {app: ollama}}
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:0.13.3
          ports: [{containerPort: 11434}]
          resources:
            requests: {cpu: "2", memory: 8Gi}
            limits: {cpu: "6", memory: 20Gi}
          readinessProbe: {httpGet: {path: /api/tags, port: 11434}, initialDelaySeconds: 20, periodSeconds: 10}
          volumeMounts: [{name: models, mountPath: /root/.ollama}]
      volumes: [{name: models, persistentVolumeClaim: {claimName: ollama-data}}]
---
apiVersion: batch/v1
kind: Job
metadata: {name: ollama-model-pull, namespace: code-context}
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: pull
          image: ollama/ollama:0.13.3
          env: [{name: OLLAMA_HOST, value: http://ollama:11434}]
          command: ["/bin/sh", "-c", "until ollama list >/dev/null 2>&1; do sleep 2; done; ollama pull qwen3-embedding:0.6b"]
