apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: code-context-default-deny, namespace: code-context}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-system}}}]
    - from: [{podSelector: {matchLabels: {app: code-context}}}]
  egress:
    - to: [{podSelector: {matchLabels: {app: postgres}}}]
      ports: [{protocol: TCP, port: 5432}]
    - to: [{podSelector: {matchLabels: {app: ollama}}}]
      ports: [{protocol: TCP, port: 11434}]
    - to: [{podSelector: {matchLabels: {app: zoekt}}}]
      ports: [{protocol: TCP, port: 6070}]
    - to: [{namespaceSelector: {}}]
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to: [{ipBlock: {cidr: 0.0.0.0/0}}]
      ports: [{protocol: TCP, port: 443}]
