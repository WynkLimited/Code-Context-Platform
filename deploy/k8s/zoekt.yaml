apiVersion: v1
kind: Service
metadata: {name: zoekt, namespace: code-context}
spec:
  selector: {app: zoekt}
  ports: [{name: http, port: 6070, targetPort: 6070}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: zoekt, namespace: code-context}
spec:
  replicas: 1
  selector: {matchLabels: {app: zoekt}}
  template:
    metadata: {labels: {app: zoekt}}
    spec:
      containers:
        - name: zoekt
          image: ghcr.io/sourcegraph/zoekt:0.0.0-20261026142308-e8242d26df19
          command: ["zoekt-webserver", "-index", "/data/index", "-rpc"]
          ports: [{containerPort: 6070}]
          resources:
            requests: {cpu: "500m", memory: 1Gi}
            limits: {cpu: "2", memory: 6Gi}
          readinessProbe: {httpGet: {path: /, port: 6070}, initialDelaySeconds: 10, periodSeconds: 10}
          volumeMounts: [{name: data, mountPath: /data}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: zoekt-data}}]
