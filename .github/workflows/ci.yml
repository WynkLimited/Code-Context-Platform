name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg17
        env:
          POSTGRES_DB: code_context_test
          POSTGRES_USER: code_context
          POSTGRES_PASSWORD: integration_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U code_context -d code_context_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/code_context_test
      DATABASE_USER: code_context
      DATABASE_PASSWORD: integration_test_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit and regression tests
        run: mvn --batch-mode --no-transfer-progress test
      - name: PostgreSQL V1-V6 shared-library impact integration
        run: mvn --batch-mode --no-transfer-progress -Ppostgres-integration verify
      - name: Publish test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-and-postgres-test-reports
          path: |
            target/surefire-reports/**
            target/failsafe-reports/**
          if-no-files-found: warn
